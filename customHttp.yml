# Response headers for AWS Amplify Hosting. Amplify reads this file from the
# repository root on every deploy — nothing to set in the console.

customHeaders:
  # Fonts and images keep their names between deploys and rarely change, so
  # repeat visitors can reuse them without asking us again.
  - pattern: '/static/fonts/**'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=31536000, immutable'
  - pattern: '/static/images/**'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=2592000'

  # Scripts do change with a release: cache for an hour, then check.
  - pattern: '/static/js/**'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=3600, must-revalidate'

  # Pages carry their own CSS inline, so they must not be cached hard.
  - pattern: '/**'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=0, must-revalidate'
      - key: 'X-Content-Type-Options'
        value: 'nosniff'
      - key: 'Referrer-Policy'
        value: 'strict-origin-when-cross-origin'
      - key: 'Strict-Transport-Security'
        value: 'max-age=31536000; includeSubDomains'
      - key: 'X-Frame-Options'
        value: 'SAMEORIGIN'
