# AWS SAM settings for the contact form and AI visibility check, one block per
# environment.
#
#   cd lambda
#   sam build
#   sam deploy --config-env dev
#   sam deploy --config-env prod
#
# Before deploying, replace the REPLACE-* values:
#   - dev ToEmail: an inbox verified in SES (while SES is in sandbox it can only
#     send to verified addresses)
#   - AllowedOrigins: every address the site is served from, comma-separated,
#     no trailing slash, e.g. https://dev.d1abc2def3.amplifyapp.com
#
# Region: eu-west-2 is London. The dooster.io domain must be verified in SES,
# and production access requested, in this same region.

version = 0.1

[dev.deploy.parameters]
stack_name = "dooster-contact-dev"
region = "eu-west-2"
capabilities = "CAPABILITY_IAM"
resolve_s3 = true
confirm_changeset = true
parameter_overrides = "Stage=dev ToEmail=support@dooster.io FromEmail=website@dooster.io AllowedOrigins=https://dev.dooster.io,https://dev.dp8exvbtxi8lp.amplifyapp.com"

[prod.deploy.parameters]
stack_name = "dooster-contact-prod"
region = "eu-west-2"
capabilities = "CAPABILITY_IAM"
resolve_s3 = true
confirm_changeset = true
parameter_overrides = "Stage=prod ToEmail=support@dooster.io FromEmail=website@dooster.io AllowedOrigins=https://www.dooster.io,https://dooster.io,https://main.dp8exvbtxi8lp.amplifyapp.com"
